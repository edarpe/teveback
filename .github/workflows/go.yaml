name: Build go app and push to azure

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.20
      - name: Build
        run: go build -o build/main.exe -v

      - name: Upload to Azure
        uses: Azure/webapps-deploy@v2
        with:
          app-name: teveeback
          package: build
          connection-string: ${{ secrets.azureWebAppPublishProfile }}
        
